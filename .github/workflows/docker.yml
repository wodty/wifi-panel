name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 自动化测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 启动中枢
        env:
          PANEL_TOKEN: panel123
        run: |
          nohup python -m uvicorn server.main:app --host 127.0.0.1 --port 8765 > /tmp/hub.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/healthz > /dev/null && echo "hub up after ${i}s" && break
            sleep 1
          done
          sleep 1
      - name: 跑测试
        run: |
          python tests/test_relay.py
          python tests/test_tv.py
          python tests/test_release_per_remote.py
          python tests/test_templates.py
          python tests/test_multi_device.py
      - name: 失败时打印中枢日志
        if: failure()
        run: cat /tmp/hub.log

  build:
    name: 构建并推送镜像
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
