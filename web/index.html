<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>wifi-panel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="view-connect">
  <div class="card">
    <h1>wifi-panel</h1>
    <p class="hint">手机浏览器控制 PC 与电视的可编程面板</p>
    <input id="host-input" type="text" inputmode="url" placeholder="中枢地址，如 192.168.1.10:8765" autocomplete="off" autocapitalize="off" spellcheck="false">
    <input id="token-input" type="password" placeholder="访问令牌 (token)" autocomplete="off">
    <button id="btn-connect" class="primary">连接</button>
    <p id="connect-err" class="err"></p>
    <p class="hint">地址留空则连当前页面所在的中枢；也可以直接打开 <code>?host=IP:8765&amp;token=令牌</code> 免输入。</p>
  </div>
</section>

<section id="view-profiles" hidden>
  <header class="bar">
    <span class="bar-title">面板列表</span>
    <span id="agent-dot" class="dot off"></span>
    <button id="btn-devices" class="ghost small">设备</button>
    <button id="btn-logout" class="ghost small">换令牌</button>
  </header>
  <div id="profile-list" class="list"></div>
  <div class="fab-row">
    <button id="btn-new" class="primary">+ 新建面板</button>
  </div>

  <div id="dev-sheet" hidden>
    <div class="tv-box">
      <button class="ghost small close" id="dev-close">收起</button>
      <h3>设备</h3>
      <p class="hint left">电脑装上 Agent 后自动出现在这里；电视点「添加电视」填 IP 就行。同一个面板可以同时管多台设备。</p>
      <div id="dev-list" class="dev-list"></div>

      <div class="row-actions">
        <button id="dev-add-tv" class="primary">+ 添加电视</button>
        <button id="dev-refresh">刷新状态</button>
      </div>

      <div id="dev-form" hidden>
        <div class="row">
          <div><label>名称</label><input id="dev-name" placeholder="客厅电视" maxlength="24"></div>
        </div>
        <div class="row">
          <div><label>协议</label>
            <select id="dev-proto">
              <option value="adb">Android TV 系（小米 / TCL·雷鸟 / 海信 / 创维 / 索尼等）</option>
              <option value="samsung">三星 Tizen</option>
              <option value="lg">LG webOS</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div><label>IP</label><input id="dev-ip" placeholder="192.168.1.50" inputmode="decimal"></div>
          <div><label>端口</label><input id="dev-port" type="number" value="5555"></div>
        </div>
        <p id="dev-proto-hint" class="hint left"></p>
        <div class="row-actions">
          <button id="dev-save" class="primary">保存</button>
          <button id="dev-cancel">取消</button>
        </div>
      </div>

      <p id="dev-msg" class="hint left"></p>
    </div>
  </div>

  <div id="tpl-sheet" hidden>
    <div class="tv-box">
      <button class="ghost small close" id="tpl-close">收起</button>
      <h3>新建面板</h3>
      <p class="hint left">选一个模板开始，之后按钮位置和动作都能改。建好以后在顶部选它控制哪台电脑 / 电视。</p>
      <div id="tpl-list" class="tpl-list"></div>
    </div>
  </div>
</section>

<section id="view-remote" hidden>
  <header class="bar">
    <button id="btn-back" class="ghost small">← 返回</button>
    <span id="profile-title" class="bar-title"></span>
    <span id="ws-dot" class="dot off"></span>
    <button id="btn-toggle-edit" class="ghost small">编辑</button>
  </header>

  <div id="dev-bar" class="dev-bar">
    <label class="dev-chip"><span>电脑</span><select id="sel-pc"></select></label>
    <label class="dev-chip"><span>电视</span><select id="sel-tv"></select></label>
    <button id="btn-save-target" class="small ghost" hidden>设为默认</button>
  </div>

  <div id="edit-tools" hidden>
    <button data-add="button">+ 按钮</button>
    <button data-add="touchpad">+ 触控板</button>
    <button id="btn-save" class="primary">保存</button>
  </div>
  <div id="stage"></div>
  <div id="cfg" class="sheet" hidden></div>
</section>

<script src="app.js"></script>
</body>
</html>
